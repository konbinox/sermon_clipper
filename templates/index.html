<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>讲道精华提取系统 | 在线版</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; border-radius: 24px; padding: 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        h1 { text-align: center; color: #333; margin-bottom: 10px; font-size: 28px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; font-size: 14px; }
        .section { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; color: #333; }
        input, select { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 12px; font-size: 14px; transition: all 0.3s; }
        input:focus, select:focus { outline: none; border-color: #667eea; }
        .topic-item { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; }
        .topic-item input:first-child { flex: 2; }
        .topic-item input:last-child { flex: 1; }
        .topic-item button { background: #ff4757; color: white; border: none; width: 32px; height: 32px; border-radius: 8px; cursor: pointer; font-size: 16px; }
        .btn-add { background: #667eea; color: white; border: none; padding: 10px 20px; border-radius: 12px; cursor: pointer; font-size: 14px; margin-top: 5px; }
        .btn-submit { width: 100%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
        .progress-container { margin-top: 20px; display: none; }
        .progress-bar { width: 100%; height: 8px; background: #e0e0e0; border-radius: 4px; overflow: hidden; }
        .progress-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #667eea, #764ba2); transition: width 0.3s; }
        .progress-text { text-align: center; margin-top: 10px; font-size: 14px; color: #666; }
        .result { margin-top: 20px; padding: 15px; border-radius: 12px; display: none; }
        .result.success { background: #d4edda; color: #155724; }
        .result.error { background: #f8d7da; color: #721c24; }
        .download-link { display: inline-block; margin-top: 10px; background: #28a745; color: white; padding: 10px 20px; border-radius: 8px; text-decoration: none; }
        .flex-row { display: flex; gap: 15px; }
        .flex-row > * { flex: 1; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎤 讲道精华提取系统</h1>
        <p class="subtitle">在线版 · 打开即用 · 无需下载</p>
        
        <form id="sermonForm">
            <div class="section">
                <label>📺 视频链接</label>
                <input type="url" id="videoUrl" placeholder="https://youtube.com/watch?v=..." required>
            </div>
            
            <div class="section">
                <label>👨‍🏫 讲道人</label>
                <select id="pastor">
                    <option value="刘彤">刘彤</option>
                    <option value="曾兴才">曾兴才</option>
                    <option value="卓尔君">卓尔君</option>
                    <option value="王亚辰">王亚辰</option>
                    <option value="郑春焕">郑春焕</option>
                    <option value="other">其他</option>
                </select>
                <input type="text" id="otherPastor" placeholder="请输入" style="display:none; margin-top:10px">
            </div>
            
            <div class="section">
                <label>📖 讲道题目</label>
                <input type="text" id="title" placeholder="请输入讲道题目" required>
            </div>
            
            <div class="section">
                <label>👤 制作人</label>
                <input type="text" id="maker" placeholder="你的名字" required>
            </div>
            
            <div class="section">
                <label>📝 主题提纲</label>
                <div id="topicsContainer">
                    <div class="topic-item">
                        <input type="text" placeholder="主题标题" class="topic-title">
                        <input type="text" placeholder="经文参考" class="topic-scripture">
                        <button type="button" onclick="removeTopic(this)">✖</button>
                    </div>
                </div>
                <button type="button" class="btn-add" onclick="addTopic()">+ 添加主题</button>
            </div>
            
            <div class="section">
                <label>⚙️ 设置</label>
                <div class="flex-row">
                    <select id="duration">
                        <option value="6">6分钟</option>
                        <option value="8" selected>8分钟</option>
                        <option value="10">10分钟</option>
                        <option value="12">12分钟</option>
                    </select>
                    <select id="subtitleLang">
                        <option value="simplified">简体字幕</option>
                        <option value="traditional">繁体字幕</option>
                        <option value="none">无字幕</option>
                    </select>
                </div>
            </div>
            
            <button type="submit" class="btn-submit" id="submitBtn">▶ 开始处理</button>
        </form>
        
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
            <div class="progress-text" id="progressText">等待开始...</div>
        </div>
        
        <div class="result" id="result"></div>
    </div>
    
    <script>
        let currentTaskId = null;
        
        // 讲道人选择
        document.getElementById('pastor').addEventListener('change', function() {
            const otherInput = document.getElementById('otherPastor');
            if (this.value === 'other') {
                otherInput.style.display = 'block';
            } else {
                otherInput.style.display = 'none';
            }
        });
        
        // 添加主题
        function addTopic() {
            const container = document.getElementById('topicsContainer');
            const div = document.createElement('div');
            div.className = 'topic-item';
            div.innerHTML = `
                <input type="text" placeholder="主题标题" class="topic-title">
                <input type="text" placeholder="经文参考" class="topic-scripture">
                <button type="button" onclick="removeTopic(this)">✖</button>
            `;
            container.appendChild(div);
        }
        
        function removeTopic(btn) {
            const container = document.getElementById('topicsContainer');
            if (container.children.length > 1) {
                btn.parentElement.remove();
            } else {
                alert('至少保留一个主题');
            }
        }
        
        // 轮询任务状态
        function pollStatus(taskId) {
            fetch(`/status/${taskId}`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('progressFill').style.width = `${data.progress}%`;
                    document.getElementById('progressText').innerText = data.message;
                    
                    if (data.status === 'completed') {
                        document.getElementById('submitBtn').disabled = false;
                        document.getElementById('submitBtn').innerText = '▶ 开始处理';
                        const resultDiv = document.getElementById('result');
                        resultDiv.style.display = 'block';
                        resultDiv.className = 'result success';
                        resultDiv.innerHTML = `
                            <strong>✅ 视频已生成！</strong><br>
                            <a href="/download/${taskId}" class="download-link" download>📥 点击下载视频</a>
                            <p style="margin-top:10px; font-size:12px">文件将在4小时后自动删除</p>
                        `;
                    } else if (data.status === 'failed') {
                        document.getElementById('submitBtn').disabled = false;
                        document.getElementById('submitBtn').innerText = '▶ 开始处理';
                        const resultDiv = document.getElementById('result');
                        resultDiv.style.display = 'block';
                        resultDiv.className = 'result error';
                        resultDiv.innerHTML = `<strong>❌ 处理失败</strong><br>${data.message}`;
                    } else {
                        setTimeout(() => pollStatus(taskId), 2000);
                    }
                });
        }
        
        // 提交表单
        document.getElementById('sermonForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // 收集数据
            let pastor = document.getElementById('pastor').value;
            if (pastor === 'other') {
                pastor = document.getElementById('otherPastor').value;
                if (!pastor) {
                    alert('请输入讲道人姓名');
                    return;
                }
            }
            
            const title = document.getElementById('title').value;
            if (!title) {
                alert('请输入讲道题目');
                return;
            }
            
            const maker = document.getElementById('maker').value;
            if (!maker) {
                alert('请输入制作人姓名');
                return;
            }
            
            const topics = [];
            const topicItems = document.querySelectorAll('.topic-item');
            for (let item of topicItems) {
                const titleInput = item.querySelector('.topic-title');
                const scriptureInput = item.querySelector('.topic-scripture');
                if (titleInput.value.trim()) {
                    topics.push({
                        title: titleInput.value.trim(),
                        scripture: scriptureInput.value.trim()
                    });
                }
            }
            
            if (topics.length === 0) {
                alert('请至少输入一个主题');
                return;
            }
            
            const duration = parseInt(document.getElementById('duration').value);
            const subtitleLang = document.getElementById('subtitleLang').value;
            
            const data = {
                url: document.getElementById('videoUrl').value,
                pastor: pastor,
                title: title,
                maker: maker,
                topics: topics,
                duration: duration,
                subtitle_lang: subtitleLang
            };
            
            // 显示进度
            document.getElementById('submitBtn').disabled = true;
            document.getElementById('submitBtn').innerText = '处理中...';
            document.getElementById('progressContainer').style.display = 'block';
            document.getElementById('result').style.display = 'none';
            document.getElementById('progressFill').style.width = '0%';
            document.getElementById('progressText').innerText = '提交中...';
            
            try {
                const response = await fetch('/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                currentTaskId = result.task_id;
                pollStatus(currentTaskId);
            } catch (error) {
                alert('提交失败: ' + error.message);
                document.getElementById('submitBtn').disabled = false;
                document.getElementById('submitBtn').innerText = '▶ 开始处理';
            }
        });
    </script>
</body>
</html>
